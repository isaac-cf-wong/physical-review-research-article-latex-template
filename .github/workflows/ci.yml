name: LaTeX CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    workflow_call:

jobs:
    pre-commit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: 3.14
                  enable-cache: 'true'
              env:
                  ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
              run: uv run prek run --all-files

    build_latex:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

            - name: Compile LaTeX document
              uses: xu-cheng/latex-action@e2f99d4b3685b0da93f97e1b86ad8fab81105098 # 3.3.0
              with:
                  working_directory: '.'
                  root_file: |
                      main.tex
